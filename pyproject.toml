[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "helios-spaceweather-connectors"
description = "Production-grade Python adapters for six space-weather data sources (NASA DONKI, CCMC SEP Scoreboards A/B/C, NOAA SWPC, NASA CDDIS GIMs, GOES, DSCOVR), normalized to a common feature schema with feature-level provenance per helios-provenance-spec."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Thomas Waweru", email = "t.waweru@577industries.com" },
    { name = "577 Industries Inc.", email = "engineering@577industries.com" },
]
keywords = ["heliophysics", "space-weather", "ml", "provenance", "fusion"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "tenacity>=8.4",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
    "pytest-httpx>=0.30",
    "hypothesis>=6.100",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
    "types-python-dateutil",
    "pandas-stubs",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
notebooks = [
    "jupyter>=1.0",
    "nbformat>=5.10",
    "matplotlib>=3.8",
]

[project.urls]
Homepage = "https://github.com/577Industries/helios-spaceweather-connectors"
Repository = "https://github.com/577Industries/helios-spaceweather-connectors.git"
Issues = "https://github.com/577Industries/helios-spaceweather-connectors/issues"
Documentation = "https://577industries.github.io/helios-spaceweather-connectors"

[tool.hatch.version]
path = "src/helios_connectors/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/helios_connectors"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "ARG", # unused arguments
    "PTH", # use pathlib
    "RUF", # ruff-specific
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.per-file-ignores]
"tests/**/*" = ["ARG", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
files = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers --cov=helios_connectors --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: integration tests that hit live network endpoints (deselect with '-m \"not live\"')",
]

[tool.coverage.run]
branch = true
source = ["src/helios_connectors"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
