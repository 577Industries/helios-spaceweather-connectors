name: CI

# This workflow does not consume any untrusted GitHub event inputs
# (issue titles, PR bodies, etc.) in `run:` steps. Secrets are exposed
# only through `env:` blocks, never inline-interpolated into shell.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly at 06:17 UTC: runs the live-integration job (real DONKI calls).
    - cron: '17 6 * * *'
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install '.[dev]'
      # Unit-test pass: deselects @pytest.mark.live to keep PR signal
      # independent of upstream NASA service availability.
      - run: pytest -m "not live"
      - if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false

  live-integration:
    # Hits real upstream endpoints (DONKI). Runs nightly via schedule
    # and on manual workflow_dispatch — never on PRs, so we never gate
    # PR signal on a flaky NASA gateway.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Cap the job: the runner default is 6 h, and the 2026-08-30 run burned
    # 2 h 33 m crawling an active ISWA month. Per-test budgets live in
    # pytest-timeout (--timeout below, plus @pytest.mark.timeout overrides);
    # this is the hard backstop.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install '.[dev]'
      - env:
          # NASA_API_KEY is optional — the live test defaults to the
          # CCMC kauai endpoint which is unauthenticated.
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
        run: pytest -m live --no-cov --timeout=300

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pip-audit
      - run: pip-audit --strict --skip-editable
        continue-on-error: true
