name: publish

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/helios-spaceweather-connectors
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Build distribution
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Verify the distribution
        run: |
          python -m pip install twine
          twine check dist/*

      - name: Publish to PyPI via trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # No api_token — uses OIDC (trusted publishing).
          # Configure at https://pypi.org/manage/project/helios-spaceweather-connectors/settings/publishing/
          # Publisher: GitHub | Organization: 577Industries | Repository: helios-spaceweather-connectors
          # Workflow: publish.yml | Environment: pypi
          print-hash: true
